<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f13">
  <title>Koda · HTML Library</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f13;
      --surface: #14171d;
      --surface-hover: #1a1e26;
      --border: #272c35;
      --text: #f1f3f6;
      --muted: #858d9b;
      --accent: #a9c7ff;
      --accent-bg: #202b3e;
      --danger: #ff9292;
      --success: #8edbb4;
      --radius: 13px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
      padding: 68px 0 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0;
    }

    h1 {
      margin: 27px 0 5px;
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .repo-panel {
      margin-top: 30px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .repo-form {
      display: flex;
      gap: 9px;
    }

    .repo-input, .search-input, .branch-input {
      width: 100%;
      min-width: 0;
      height: 43px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #0f1217;
      color: var(--text);
      transition: border-color .16s, background .16s;
    }

    .repo-input::placeholder, .search-input::placeholder, .branch-input::placeholder { color: #68717e; }
    .repo-input:focus, .search-input:focus, .branch-input:focus { border-color: #647d9f; background: #11151b; }

    .button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 41px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #20252e;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .16s, border-color .16s, opacity .16s;
    }

    .button:hover:not(:disabled) { background: #292f3a; border-color: #39414e; }
    .button:disabled { opacity: .42; cursor: not-allowed; }
    .button-primary { border-color: #c1d6fa; background: #c1d6fa; color: #101722; }
    .button-primary:hover:not(:disabled) { border-color: #d4e2fb; background: #d4e2fb; }
    .button-small { min-height: 32px; padding: 0 10px; font-size: 12px; }

    details { margin-top: 11px; }
    summary {
      width: fit-content;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }
    summary:hover { color: var(--text); }
    .branch-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .branch-row label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .branch-input { height: 36px; }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #c3c9d2;
      font-size: 12px;
    }
    .status.show { display: block; }
    .status.error { border-color: #57383d; background: #211619; color: var(--danger); }
    .status.success { border-color: #294b3c; background: #142019; color: var(--success); }

    .library { margin-top: 35px; }
    .library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 13px;
    }
    .library-title { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
    .repo-meta { margin-top: 3px; overflow-wrap: anywhere; color: var(--muted); font-size: 12px; }
    .head-actions { display: flex; gap: 7px; }

    .search-wrap { position: relative; margin-bottom: 11px; }
    .search-symbol {
      position: absolute;
      top: 10px;
      left: 13px;
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
    }
    .search-input { height: 39px; padding-left: 37px; font-size: 13px; }

    .file-list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 60px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      transition: background .14s;
    }
    .file-row:last-child { border-bottom: 0; }
    .file-row:hover { background: var(--surface-hover); }
    .file-info { display: flex; min-width: 0; align-items: center; gap: 11px; }
    .file-type {
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid #344052;
      border-radius: 8px;
      background: var(--accent-bg);
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .file-text { min-width: 0; }
    .file-name {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-path {
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
    .file-size { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }

    .empty { padding: 38px 18px; color: var(--muted); text-align: center; font-size: 12px; }
    .empty strong { display: block; margin-bottom: 4px; color: #dfe3e9; font-size: 13px; font-weight: 600; }
    .footer { margin-top: 24px; color: #626b78; font-size: 11px; text-align: center; }
    .footer a { color: #9eb5d7; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .page { width: min(100% - 28px, 500px); padding-top: 34px; }
      .repo-panel { padding: 12px; }
      .repo-form { flex-direction: column; }
      .repo-form .button { width: 100%; }
      .library-head { align-items: flex-start; flex-direction: column; }
      .head-actions { width: 100%; }
      .head-actions .button { flex: 1; }
      .file-size { display: none; }
      .file-row { padding: 9px 10px; }
      .file-info { gap: 9px; }
      .button-small { padding: 0 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }


    /* Monochrome, hard-edge visual system */
    :root {
      --bg: #050505;
      --surface: #0d0d0d;
      --surface-hover: #171717;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --accent: #e8e8e8;
      --accent-bg: #151515;
      --danger: #d0d0d0;
      --success: #d0d0d0;
      --radius: 0;
    }

    *, *::before, *::after {
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body { background: #050505; color: #f5f5f5; }
    .brand-mark {
      border-color: #383838;
      background: #101010;
      color: #f5f5f5;
    }
    .repo-panel, .file-list { background: #0d0d0d; border-color: #292929; }
    .repo-input, .search-input, .branch-input {
      background: #050505;
      border-color: #303030;
      color: #f5f5f5;
    }
    .repo-input:focus, .search-input:focus, .branch-input:focus {
      border-color: #f0f0f0;
      background: #080808;
      box-shadow: 0 0 0 1px #f0f0f0 !important;
    }
    .button {
      border-color: #353535;
      background: #171717;
      color: #ededed;
    }
    .button:hover:not(:disabled) {
      border-color: #777;
      background: #262626;
    }
    .button-primary,
    .button-primary:hover:not(:disabled) {
      border-color: #f2f2f2;
      background: #f2f2f2;
      color: #050505;
    }
    .file-type {
      border-color: #3a3a3a;
      background: #151515;
      color: #e5e5e5;
    }
    .file-row { border-color: #242424; }
    .file-row:hover { background: #171717; }
    .status { border-color: #303030; background: #101010; color: #d0d0d0; }
    .status.error, .status.success {
      border-color: #454545;
      background: #111;
      color: #e0e0e0;
    }
    .footer a { color: #d8d8d8; }
    .repo-input::placeholder, .search-input::placeholder, .branch-input::placeholder { color: #777; }
    ::selection { background: #e5e5e5; color: #050505; }

  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><span class="brand-mark">K</span> Koda · Library</div>
      <h1>HTML-Dateien</h1>
      <p class="intro">Alle HTML-Dateien aus deinem Repository an einem Ort.</p>
    </header>

    <section class="repo-panel" aria-label="Repository auswählen">
      <form class="repo-form" id="repoForm">
        <input
          class="repo-input"
          id="repoInput"
          type="text"
          placeholder="GitHub-Repository oder owner/repo"
          autocomplete="url"
          aria-label="GitHub-Repository"
          required
        >
        <button class="button button-primary" id="loadBtn" type="submit">Repository laden <span aria-hidden="true">→</span></button>
      </form>
      <details>
        <summary>Erweiterte Optionen</summary>
        <div class="branch-row">
          <label for="branchInput">Branch</label>
          <input class="branch-input" id="branchInput" type="text" placeholder="Standard-Branch verwenden">
        </div>
      </details>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="library" aria-label="HTML-Dateien">
      <div class="library-head">
        <div>
          <h2 class="library-title">Dateien</h2>
          <div class="repo-meta" id="repoLabel">Noch kein Repository geladen</div>
        </div>
        <div class="head-actions">
          <button class="button button-small" id="refreshBtn" type="button" disabled>Aktualisieren</button>
          <button class="button button-small" id="zipBtn" type="button" disabled>↓ ZIP herunterladen</button>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-symbol" aria-hidden="true">⌕</span>
        <input class="search-input" id="searchInput" type="search" placeholder="Dateien durchsuchen …" disabled aria-label="Dateien durchsuchen">
      </div>

      <div class="file-list" id="fileList">
        <div class="empty"><strong>Noch keine Dateien</strong>Lade ein GitHub-Repository, um deine HTML-Dateien anzuzeigen.</div>
      </div>
    </section>

    <footer class="footer">
      Öffentliche GitHub-Repositories · <a href="https://docs.github.com/en/rest/git/trees" target="_blank" rel="noopener noreferrer">GitHub API</a>
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const state = { owner: '', repo: '', branch: '', files: [] };

      function setStatus(message, type = '') {
        const el = $('status');
        el.textContent = message;
        el.className = `status show${type ? ` ${type}` : ''}`;
      }

      function clearStatus() {
        $('status').textContent = '';
        $('status').className = 'status';
      }

      function parseRepo(value) {
        const input = value.trim().replace(/\.git$/i, '').replace(/\/$/, '');
        if (!input) throw new Error('Bitte gib ein GitHub-Repository ein.');

        let match = input.match(/github\.com\/([^/]+)\/([^/?#]+)/i);
        if (match) return { owner: match[1], repo: match[2].replace(/\.git$/i, '') };

        match = input.match(/^([^/\s]+)\/([^/\s]+)$/);
        if (match) return { owner: match[1], repo: match[2] };

        throw new Error('Repository nicht erkannt. Beispiel: github.com/Benutzer/Repository');
      }

      function detectCurrentRepo() {
        const host = location.hostname.toLowerCase();
        if (!host.endsWith('.github.io')) return null;
        const owner = host.slice(0, -'.github.io'.length);
        const parts = location.pathname.split('/').filter(Boolean);
        const repo = parts[0] || `${owner}.github.io`;
        return owner && repo ? { owner, repo } : null;
      }

      function encodePath(path) {
        return path.split('/').map(encodeURIComponent).join('/');
      }

      function rawUrl(owner, repo, branch, path) {
        const safeBranch = branch.split('/').map(encodeURIComponent).join('/');
        return `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${safeBranch}/${encodePath(path)}`;
      }

      function formatSize(bytes) {
        if (bytes == null) return '—';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function fileName(path) {
        return path.split('/').pop() || path;
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function loadRepository() {
        const button = $('loadBtn');
        button.disabled = true;
        button.innerHTML = 'Lädt …';
        clearStatus();
        $('fileList').innerHTML = '<div class="empty"><strong>Repository wird geladen</strong>Die Dateien werden abgerufen.</div>';
        $('zipBtn').disabled = true;
        $('refreshBtn').disabled = true;
        $('searchInput').disabled = true;

        try {
          const { owner, repo } = parseRepo($('repoInput').value);
          const repoApi = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
          const headers = { Accept: 'application/vnd.github+json' };
          const repoResponse = await fetch(repoApi, { headers });

          if (!repoResponse.ok) {
            if (repoResponse.status === 404) throw new Error('Repository nicht gefunden oder nicht öffentlich.');
            if (repoResponse.status === 403) throw new Error('GitHub-API-Limit erreicht. Bitte später erneut versuchen.');
            throw new Error(`GitHub-Fehler (${repoResponse.status}).`);
          }

          const repoData = await repoResponse.json();
          const branch = $('branchInput').value.trim() || repoData.default_branch;
          const treeUrl = `${repoApi}/git/trees/${encodeURIComponent(branch)}?recursive=1`;
          const treeResponse = await fetch(treeUrl, { headers });
          if (!treeResponse.ok) throw new Error(`Branch „${branch}“ konnte nicht geladen werden (${treeResponse.status}).`);

          const treeData = await treeResponse.json();
          const files = (treeData.tree || [])
            .filter(item => item.type === 'blob' && /\.html?$/i.test(item.path))
            .map(item => ({
              path: item.path,
              size: item.size ?? null,
              rawUrl: rawUrl(owner, repo, branch, item.path)
            }))
            .sort((a, b) => a.path.localeCompare(b.path, 'de', { numeric: true, sensitivity: 'base' }));

          Object.assign(state, { owner, repo, branch, files });
          $('repoLabel').textContent = `${owner}/${repo} · ${branch}`;
          $('searchInput').disabled = files.length === 0;
          $('searchInput').value = '';
          $('refreshBtn').disabled = false;
          $('zipBtn').disabled = files.length === 0;
          renderFiles();

          const note = treeData.truncated ? ' GitHub hat die Dateiliste möglicherweise gekürzt.' : '';
          setStatus(`${files.length} HTML-Datei${files.length === 1 ? '' : 'en'} gefunden.${note}`, treeData.truncated ? '' : 'success');
        } catch (error) {
          state.files = [];
          $('repoLabel').textContent = 'Kein Repository geladen';
          $('fileList').innerHTML = '';
          const empty = document.createElement('div');
          empty.className = 'empty';
          const title = document.createElement('strong');
          title.textContent = 'Repository konnte nicht geladen werden';
          empty.append(title, document.createTextNode(error.message));
          $('fileList').appendChild(empty);
          setStatus(error.message, 'error');
        } finally {
          button.disabled = false;
          button.innerHTML = 'Repository laden <span aria-hidden="true">→</span>';
          $('refreshBtn').disabled = state.files.length === 0;
          $('zipBtn').disabled = state.files.length === 0;
        }
      }

      function renderFiles() {
        const query = $('searchInput').value.trim().toLocaleLowerCase('de');
        const files = state.files.filter(file => file.path.toLocaleLowerCase('de').includes(query));
        const list = $('fileList');
        list.replaceChildren();

        if (!files.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          const title = document.createElement('strong');
          title.textContent = state.files.length ? 'Keine Treffer' : 'Keine HTML-Dateien gefunden';
          empty.append(title, document.createTextNode(state.files.length ? 'Passe deinen Suchbegriff an.' : 'In diesem Repository wurden keine HTML-Dateien gefunden.'));
          list.appendChild(empty);
          return;
        }

        for (const file of files) {
          const row = document.createElement('div');
          row.className = 'file-row';

          const info = document.createElement('div');
          info.className = 'file-info';
          const type = document.createElement('div');
          type.className = 'file-type';
          type.textContent = 'HTML';

          const text = document.createElement('div');
          text.className = 'file-text';
          const name = document.createElement('div');
          name.className = 'file-name';
          name.textContent = fileName(file.path);
          name.title = file.path;
          const path = document.createElement('div');
          path.className = 'file-path';
          path.textContent = file.path;
          path.title = file.path;
          text.append(name, path);
          info.append(type, text);

          const actions = document.createElement('div');
          actions.className = 'file-actions';
          const size = document.createElement('span');
          size.className = 'file-size';
          size.textContent = formatSize(file.size);
          const download = document.createElement('button');
          download.className = 'button button-small';
          download.type = 'button';
          download.textContent = '↓ Download';
          download.addEventListener('click', () => downloadOne(file, download));
          actions.append(size, download);
          row.append(info, actions);
          list.appendChild(row);
        }
      }

      async function downloadOne(file, button) {
        const previous = button.textContent;
        button.disabled = true;
        button.textContent = 'Lädt …';
        try {
          const response = await fetch(file.rawUrl);
          if (!response.ok) throw new Error(`Download fehlgeschlagen (${response.status}).`);
          downloadBlob(await response.blob(), fileName(file.path));
        } catch (error) {
          setStatus(`„${file.path}“ konnte nicht heruntergeladen werden: ${error.message}`, 'error');
        } finally {
          button.disabled = false;
          button.textContent = previous;
        }
      }

      async function downloadZip() {
        if (!state.files.length) return;
        if (typeof JSZip === 'undefined') {
          setStatus('Die ZIP-Funktion konnte nicht geladen werden. Prüfe deine Internetverbindung.', 'error');
          return;
        }

        const button = $('zipBtn');
        button.disabled = true;
        let completed = 0;
        let index = 0;
        const zip = new JSZip();
        setStatus(`ZIP wird erstellt: 0 von ${state.files.length} Dateien …`);

        try {
          const workers = Array.from({ length: Math.min(5, state.files.length) }, async () => {
            while (index < state.files.length) {
              const file = state.files[index++];
              const response = await fetch(file.rawUrl);
              if (!response.ok) throw new Error(`Download von ${file.path} fehlgeschlagen (${response.status}).`);
              zip.file(file.path, await response.blob());
              completed++;
              setStatus(`ZIP wird erstellt: ${completed} von ${state.files.length} Dateien …`);
            }
          });

          await Promise.all(workers);
          const blob = await zip.generateAsync({
            type: 'blob',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
          }, progress => setStatus(`ZIP wird gepackt: ${Math.round(progress.percent)} % …`));

          downloadBlob(blob, `${state.repo}-html-dateien.zip`);
          setStatus(`${state.files.length} HTML-Dateien wurden als ZIP heruntergeladen.`, 'success');
        } catch (error) {
          setStatus(`ZIP konnte nicht erstellt werden: ${error.message}`, 'error');
        } finally {
          button.disabled = false;
        }
      }

      $('repoForm').addEventListener('submit', event => {
        event.preventDefault();
        loadRepository();
      });
      $('refreshBtn').addEventListener('click', loadRepository);
      $('zipBtn').addEventListener('click', downloadZip);
      $('searchInput').addEventListener('input', renderFiles);

      const detected = detectCurrentRepo();
      if (detected) {
        $('repoInput').value = `https://github.com/${detected.owner}/${detected.repo}`;
        loadRepository();
      }
    })();
  </script>
</body>
</html>
